    <script>
      // Ensure window.fetch is writable so test runners and extension executors can wrap it safely
      (function() {
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _origFetch; },
            set: function(fn) { _origFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var _origFetchProto = Window.prototype.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() { return _origFetchProto; },
              set: function(fn) { _origFetchProto = fn; },
              configurable: true,
              enumerable: true
            });
          } catch (err) {}
        }
      })();
    </script>
